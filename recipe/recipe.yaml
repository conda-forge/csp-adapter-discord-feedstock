context:
  name: csp-adapter-discord
  version: "0.2.2"
  python_min: '3.11'

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/csp-adapter-discord/csp_adapter_discord-${{ version }}.tar.gz
  sha256: 4eea32ba78c4186640cb6e8a418a42e7e60b5c110153abf78842891f363e7622

build:
  number: 0
  noarch: python
  script: python -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - chatom
    - csp
    - discord.py
    - pydantic >=2

tests:
  - python:
      imports:
        - csp_adapter_discord
      pip_check: true
      python_version: ${{ python_min }}.*

about:
  license: Apache-2.0
  license_file: LICENSE
  summary: CSP adapter for Discord
  homepage: https://github.com/timkpaine/csp-adapter-discord
  repository: https://github.com/timkpaine/csp-adapter-discord

extra:
  recipe-maintainers:
    - timkpaine
